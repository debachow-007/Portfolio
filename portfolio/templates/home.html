{% extends "layout.html" %}
{% block content %}

<div class="container text-center">
    <div class="jumbotron jumbotron-fluid">
        <h1 style="font-size: 60px;">Hi! I am</h1>
        <h1 style="font-size: 60px; font-weight: 600;">Debargha Chowdhury</h1>
        <div class="conatiner" style="height: 180px; display: flex; align-items: center; justify-content: center;">
            <span class="auto" style="font-weight: 600; font-size: 50px; color: #FFDE59;"></span>
        </div>
    </div>
    <br>
    <div class="row justify-content-center">
        <div class="col-md-8 text-start">
            <p class="lead text-justify">
                {{ home_text }}
            </p>
        </div>
        <div class="col-md-4 d-flex flex-column flex-md-column align-items-center justify-content-md-start mt-4">
            <a href="{{ url_for('resume') }}" class="btn btn-primary mb-3 fw-bold">Download CV
                <i class="fas fa-download"></i>
            </a>
            <p class="fw-light text-wrap">...or if you prefer a bot</p>
            <button class="btn btn-primary fw-bold" id="chat-toggle" onclick="toggleChat()">
                Chat
            </button>
        </div>
    </div>
</div>

<div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Start Chat</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="text" id="user-name" class="form-control mb-2" placeholder="Your Name" />
                <input type="email" id="user-email" class="form-control mb-2" placeholder="Your Email" />
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button class="btn btn-primary" onclick="startChatSession()">Start Chat</button>
            </div>
        </div>
    </div>
</div>

<div id="chat-widget">
    <div class="card shadow">
        <div class="card-header bg-primary text-white position-relative">
            <strong>Need Help?</strong>
            <div class="chat-controls">
                <button onclick="minimizeChat()">_</button>
                <button onclick="closeChat()">×</button>
            </div>
        </div>
        <div class="card-body bg-light" id="chat-box"></div>
        <div class="card-footer p-2">
            <div class="input-group">
                <input type="text" id="chat-input" class="form-control" placeholder="Ask something..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
            <button onclick="endChat()" class="btn btn-danger mt-2">End Chat</button>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
<script>
    var typed = new Typed(".auto", {
    strings: {{ roles|tojson|safe }},
    typeSpeed: 60,
    backSpeed: 30,
    loop: true,
    });

    const csrfToken = "{{ csrf_token() }}";

    function toggleChat() {
        const widget = document.getElementById('chat-widget');
        widget.style.display = widget.style.display === 'none' || widget.style.display === '' ? 'block' : 'none';
    }

    function closeChat() {
        const widget = document.getElementById('chat-widget');
        widget.style.display = 'none';
    }

    function minimizeChat() {
        const chatBox = document.getElementById('chat-box');
        chatBox.style.display = chatBox.style.display === 'none' ? 'block' : 'none';
    }

    function endChat() {
        fetch("/reset", {
            method: "POST"
        }).then(() => {
            document.getElementById('chat-box').innerHTML = '';
            closeChat();
        }).catch(err => {
            console.error("Failed to end chat:", err);
        });
    }

    function sendMessage() {
        const input = document.getElementById("chat-input");
        const msg = input.value.trim();
        if (!msg) return;

        input.value = "";

        const box = document.getElementById("chat-box");
        box.innerHTML += `<div class="user-message my-2"><strong>You:</strong> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;

        fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify({ message: msg })
        })
        .then(res => res.json())
        .then(data => {
            box.innerHTML += `<div class="bot-message my-2"><strong>Bot:</strong> ${data.response}</div>`;
            box.scrollTop = box.scrollHeight;
        })
        .catch(err => {
            box.innerHTML += `<div class="bot-message my-2 text-danger"><strong>Bot:</strong> Failed to respond.</div>`;
            console.error(err);
        });
    }
</script>

{% endblock content %}
